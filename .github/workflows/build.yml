name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

# 允许 CI 创建/更新 Release(上传 APK 供直接下载)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # secret 不能直接用于步骤 if:,先映射到 job 级 env 再判断
    env:
      CTS_KEYSTORE_BASE64: ${{ secrets.CTS_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 可选:有配置发布密钥库的 secret 才解码;没有则跳过,release 自动回退 debug 签名。
      # 需要的仓库 secrets(Settings → Secrets and variables → Actions):
      #   CTS_KEYSTORE_BASE64     —  base64(你的 .jks)   生成: base64 -w0 release.jks
      #   CTS_KEYSTORE_PASSWORD   —  密钥库口令
      #   CTS_KEY_ALIAS           —  密钥别名
      #   CTS_KEY_PASSWORD        —  密钥口令
      #   CTS_CERT_SHA256         —  发布证书 SHA-256(小写 hex,可带冒号),启用重签名检测
      - name: Decode release keystore (optional)
        if: ${{ env.CTS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CTS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CTS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Release APK
        env:
          CTS_KEYSTORE_PASSWORD: ${{ secrets.CTS_KEYSTORE_PASSWORD }}
          CTS_KEY_ALIAS: ${{ secrets.CTS_KEY_ALIAS }}
          CTS_KEY_PASSWORD: ${{ secrets.CTS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon -PctsCertSha256="${{ secrets.CTS_CERT_SHA256 }}"

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk     dist/CTS-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/CTS-release.apk

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CTS-debug
          path: dist/CTS-debug.apk

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CTS-release
          path: dist/CTS-release.apk

      # 把 APK 发布到 Releases,可在仓库 Releases 页面直接下载(无需登录)
      - name: Publish to rolling "latest" Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新构建 (latest)"
          body: |
            自动构建的 APK，直接下载安装：
            - **CTS-release.apk** — 发布版(debug 签名,可直接安装)
            - **CTS-debug.apk** — 调试版

            提交: ${{ github.sha }}
          prerelease: true
          files: |
            dist/CTS-debug.apk
            dist/CTS-release.apk
