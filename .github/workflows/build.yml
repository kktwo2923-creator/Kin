name: Build kin

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

# 本工作流负责发布滚动 "latest" Release(仅手动触发),需要写权限。
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # secret 不能直接用于步骤 if:,先映射到 job 级 env 再判断
    env:
      CTS_KEYSTORE_BASE64: ${{ secrets.CTS_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 可选: 编 Rust native 采样库(libctssampler.so)进 jniLibs。
      # continue-on-error: 即使 Rust 没编成也不挡 APK——没有 .so 时
      # Kotlin 侧 NativeSampler.available=false, 自动退回纯 Kotlin 实现。
      - name: Build Rust native sampler (optional)
        id: rustlib
        continue-on-error: true
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}}"
          echo "NDK=$ANDROID_NDK_HOME"
          ( cd rust/ctssampler && cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release )
          ls -R app/src/main/jniLibs || true

      # 可选:有配置发布密钥库的 secret 才解码;没有则跳过,release 自动回退 debug 签名。
      - name: Decode release keystore (optional)
        if: ${{ env.CTS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CTS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CTS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 单一版本:直接构建默认 variant(无 flavor)
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Release APK
        env:
          CTS_KEYSTORE_PASSWORD: ${{ secrets.CTS_KEYSTORE_PASSWORD }}
          CTS_KEY_ALIAS: ${{ secrets.CTS_KEY_ALIAS }}
          CTS_KEY_PASSWORD: ${{ secrets.CTS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon -PctsCertSha256="${{ secrets.CTS_CERT_SHA256 }}"

      - name: Collect & rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/kin-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk     dist/kin-debug.apk
          ls -la dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true       # 产物上传失败(配额满)不算编译失败
        with:
          name: kin
          path: |
            dist/kin-release.apk
            dist/kin-debug.apk
          retention-days: 2          # APK 较大, 短期保留, 避免占满 Actions 存储配额

      # 滚动 "latest" Release 仅手动触发, 避免推送时自动覆盖对外发售的正版 APK。
      - name: Publish to rolling "latest" Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新构建 (latest)"
          body: |
            自动构建的 kin APK，直接下载安装:
            - **kin-release.apk** — 正式版
            - **kin-debug.apk** — 调试版

            提交: ${{ github.sha }}
          prerelease: true
          files: |
            dist/kin-release.apk
            dist/kin-debug.apk
