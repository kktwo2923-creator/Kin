name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

# 允许 CI 创建/更新 Release(上传 APK 供直接下载)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # secret 不能直接用于步骤 if:,先映射到 job 级 env 再判断
    env:
      CTS_KEYSTORE_BASE64: ${{ secrets.CTS_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 可选:有配置发布密钥库的 secret 才解码;没有则跳过,release 自动回退 debug 签名。
      - name: Decode release keystore (optional)
        if: ${{ env.CTS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CTS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CTS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # assembleDebug / assembleRelease 是 meta 任务:一次性构建 gongyi(公益版) 与 juanzeng(捐赠版) 两个 flavor。
      - name: Build Debug APKs (both editions)
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Release APKs (both editions)
        env:
          CTS_KEYSTORE_PASSWORD: ${{ secrets.CTS_KEYSTORE_PASSWORD }}
          CTS_KEY_ALIAS: ${{ secrets.CTS_KEY_ALIAS }}
          CTS_KEY_PASSWORD: ${{ secrets.CTS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon -PctsCertSha256="${{ secrets.CTS_CERT_SHA256 }}"

      - name: Collect & rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/gongyi/release/app-gongyi-release.apk       dist/CTS-gongyi-release.apk
          cp app/build/outputs/apk/juanzeng/release/app-juanzeng-release.apk   dist/CTS-juanzeng-release.apk
          cp app/build/outputs/apk/gongyi/debug/app-gongyi-debug.apk           dist/CTS-gongyi-debug.apk
          cp app/build/outputs/apk/juanzeng/debug/app-juanzeng-debug.apk       dist/CTS-juanzeng-debug.apk
          ls -la dist/

      # 公益版(gongyi):免授权,安装即用
      - name: Upload 公益版 APKs (gongyi)
        uses: actions/upload-artifact@v4
        continue-on-error: true       # 产物上传失败(配额满)不算编译失败
        with:
          name: CTS-gongyi
          path: |
            dist/CTS-gongyi-release.apk
            dist/CTS-gongyi-debug.apk
          retention-days: 2          # APK 较大, 短期保留, 避免占满 Actions 存储配额

      # 捐赠版(juanzeng):卡密授权
      - name: Upload 捐赠版 APKs (juanzeng)
        uses: actions/upload-artifact@v4
        continue-on-error: true       # 产物上传失败(配额满)不算编译失败
        with:
          name: CTS-juanzeng
          path: |
            dist/CTS-juanzeng-release.apk
            dist/CTS-juanzeng-debug.apk
          retention-days: 2          # APK 较大, 短期保留, 避免占满 Actions 存储配额

      # 双版本上线期间:推送只产内部 artifact(上面两步);公开 "latest" 发布改为「仅手动触发」,
      # 避免覆盖现有对外发售的正版 APK。需要对外发布时在 Actions 页手动 Run workflow 即可。
      - name: Publish to rolling "latest" Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新构建 (latest)"
          body: |
            自动构建的 APK，直接下载安装:
            - **CTS-juanzeng-release.apk** — 捐赠版(卡密授权)
            - **CTS-gongyi-release.apk** — 公益版(免授权，安装即用)
            - 同名 -debug.apk 为各自调试版

            提交: ${{ github.sha }}
          prerelease: true
          files: |
            dist/CTS-juanzeng-release.apk
            dist/CTS-gongyi-release.apk
            dist/CTS-juanzeng-debug.apk
            dist/CTS-gongyi-debug.apk
