name: Build 捐赠版 (juanzeng)

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

# 仅本(捐赠版)工作流负责发布滚动 Release(避免与公益版重复发布 latest tag)
permissions:
  contents: write

concurrency:
  group: build-juanzeng-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # secret 不能直接用于步骤 if:,先映射到 job 级 env 再判断
    env:
      CTS_KEYSTORE_BASE64: ${{ secrets.CTS_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 可选:有配置发布密钥库的 secret 才解码;没有则跳过,release 自动回退 debug 签名。
      - name: Decode release keystore (optional)
        if: ${{ env.CTS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CTS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CTS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 只构建 捐赠版(juanzeng) 这一个 flavor
      - name: Build Debug APK (juanzeng)
        run: gradle :app:assembleJuanzengDebug --no-daemon

      - name: Build Release APK (juanzeng)
        env:
          CTS_KEYSTORE_PASSWORD: ${{ secrets.CTS_KEYSTORE_PASSWORD }}
          CTS_KEY_ALIAS: ${{ secrets.CTS_KEY_ALIAS }}
          CTS_KEY_PASSWORD: ${{ secrets.CTS_KEY_PASSWORD }}
        run: gradle :app:assembleJuanzengRelease --no-daemon -PctsCertSha256="${{ secrets.CTS_CERT_SHA256 }}"

      - name: Collect & rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/juanzeng/release/app-juanzeng-release.apk dist/CTS-juanzeng-release.apk
          cp app/build/outputs/apk/juanzeng/debug/app-juanzeng-debug.apk     dist/CTS-juanzeng-debug.apk
          ls -la dist/

      # 捐赠版(juanzeng):卡密授权
      - name: Upload 捐赠版 APKs (juanzeng)
        uses: actions/upload-artifact@v4
        continue-on-error: true       # 产物上传失败(配额满)不算编译失败
        with:
          name: CTS-juanzeng
          path: |
            dist/CTS-juanzeng-release.apk
            dist/CTS-juanzeng-debug.apk
          retention-days: 2          # APK 较大, 短期保留, 避免占满 Actions 存储配额

      # 滚动 "latest" Release 由本(捐赠版)工作流统一负责, 且仅手动触发:
      #   1) 避免推送时自动覆盖对外发售的正版 APK;
      #   2) 避免与公益版工作流重复发布同一个 latest tag。
      - name: Publish to rolling "latest" Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新构建 (latest)"
          body: |
            自动构建的 捐赠版 APK，直接下载安装:
            - **CTS-juanzeng-release.apk** — 捐赠版(卡密授权)
            - **CTS-juanzeng-debug.apk** — 捐赠版调试版

            提交: ${{ github.sha }}
          prerelease: true
          files: |
            dist/CTS-juanzeng-release.apk
            dist/CTS-juanzeng-debug.apk
